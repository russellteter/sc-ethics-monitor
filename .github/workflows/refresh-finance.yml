name: Refresh house finance data

on:
  schedule:
    # Sun 11:00 PM ET, year-round (covers EST UTC-5 and EDT UTC-4).
    # GitHub Actions cron is UTC-only and has no DST awareness, so we register
    # both shifts. EST: 11 PM Sun = 04:00 UTC Mon. EDT: 11 PM Sun = 03:00 UTC Mon.
    # The dedup guard below logs a notice if a run lands within 12h of the prior
    # generated_at so the duplicate firing is observable.
    - cron: '0 3 * * 1'  # Sun 11 PM EDT (Mar–Nov)
    - cron: '0 4 * * 1'  # Sun 11 PM EST (Nov–Mar)
  workflow_dispatch:
    inputs:
      reason:
        description: 'What triggered this run'
        required: false
        default: 'manual'

permissions:
  contents: write

concurrency:
  group: refresh-finance
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout (this repo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Checkout VREMS sibling repo (read-only deploy key)
        uses: actions/checkout@v4
        with:
          repository: russellteter/sc-vrems-filing-monitor
          path: vrems-sibling
          ref: main
          ssh-key: ${{ secrets.VREMS_DEPLOY_KEY }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r requirements-dev.txt
      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium
      - name: Dedup guard (observe duplicate runs within 12h)
        id: dedup
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone, timedelta
          try:
              with open("data/house_finance.json") as f:
                  generated_at = json.load(f).get("generated_at")
              if generated_at:
                  age = datetime.now(timezone.utc) - datetime.fromisoformat(
                      generated_at.replace("Z", "+00:00")
                  )
                  if age < timedelta(hours=12):
                      print(f"::notice::artifact is {age} old (generated_at={generated_at}); this run already refreshed within 12h")
                  else:
                      print(f"artifact age: {age} (generated_at={generated_at})")
          except Exception as exc:
              print(f"dedup guard skipped: {exc}")
          PY
      - name: Run scraper
        env:
          PYTHONUNBUFFERED: '1'
          REFRESH_REASON: ${{ inputs.reason || 'cron' }}
          VREMS_STATE_PATH: ${{ github.workspace }}/vrems-sibling/state.json
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python -m src.finance
      - name: Show stats
        run: |
          python -c "
          import json
          d = json.load(open('data/house_finance.json'))
          print(f\"  generated_at: {d['generated_at']}\")
          print(f\"  candidates: {len(d['candidates'])}\")
          print(f\"  filed: {d['stats']['filed']}\")
          print(f\"  not_filed: {d['stats']['not_filed']}\")
          print(f\"  scrape_failed: {d['stats']['scrape_failed']}\")
          "
      - name: Commit artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/house_finance.json data/personId_cache.json data/party_cache.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(data): refresh house_finance.json [skip ci]"
            git push
          fi
      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        run: |
          python - <<'PY'
          import os, json, urllib.request, urllib.error
          api = os.environ.get("RESEND_API_KEY")
          if not api:
              print("RESEND_API_KEY not set; skipping email")
              raise SystemExit(0)
          run_url = f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}"
          # An empty-string secret is "set but blank": treat it as unset so the default applies.
          sender = os.environ.get("FROM_EMAIL", "").strip() or "alerts@info.locality-ai.com"
          to = os.environ.get("NOTIFICATION_EMAIL", "").strip() or "russell@locality-ai.com"
          body = {
              "from": sender,
              "to": [to],
              "subject": "[FAIL] SC House finance refresh",
              "text": f"Scraper failed. Run: {run_url}"
          }
          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps(body).encode(),
              headers={"Authorization": f"Bearer {api}", "Content-Type": "application/json", "User-Agent": "sc-house-finance-monitor/1.0"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  print("Resend status", r.status)
          except urllib.error.HTTPError as e:
              print("::warning::Resend returned", e.code, e.read().decode()[:500])
          except Exception as e:
              print("::warning::alert email could not be sent:", e)
          PY
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Automated] House finance refresh failed on ${new Date().toISOString().split('T')[0]}`,
              body: `See the [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`,
              labels: ['bug', 'automated']
            });
            console.log(`Created issue #${issue.data.number}`);
